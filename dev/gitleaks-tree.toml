# gitleaks for the working tree scan (`gitleaks dir`, in `make gitleaks`).
# Inherits `.gitleaks.toml` (default rules + D15 allowlist) and only adds the dirs that
# `.gitignore` keeps out of git. The index (`--staged`) and history scans use
# `.gitleaks.toml` directly, without this list: a `.dev/` file forced into git
# (`git add -f`) is found.

title = "Ward (árvore de trabalho)"

[extend]
# Path relative to the repository root (the Makefile runs from there).
path = ".gitleaks.toml"

[[allowlists]]
# Dirs that `.gitignore` already keeps out of git (test vault, build, dependencies).
description = "Diretórios ignorados pelo git"
paths = [
    '''^\.dev/''',
    '''^target/''',
    '''(^|/)node_modules/''',
    '''(^|/)dist/''',
    '''^\.claude/worktrees/''',   # the workers' worktrees: each one runs its own make check
    '''(^|/)dist-teste/''',
    '''^app/src-tauri/target/''',
    '''^app/src-tauri/gen/''',
    '''^app/src-tauri/permissions/autogenerated/''',
]
