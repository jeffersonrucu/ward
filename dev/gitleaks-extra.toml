# gitleaks - extra scan for private keys and AWS credentials (Phase 12a, S15).
#
# No `useDefault`: does not inherit the global path allowlist of the default gitleaks
# rules (`gitleaks.toml`, lockfiles, images, svg, pdf, fonts, vendor...), which let a private
# key through in a `package-lock.json`, an `.svg` or a `gitleaks.toml`.
# Only three rules, with rare false positives, and NO path or value allowlist: no fake
# D15 value matches them. Used directly on the index and the history; the working tree
# uses `dev/gitleaks-extra-tree.toml`, which only drops the ignored dirs.
# The Makefile runs it with `--max-archive-depth`, to go into .gz/.zip/.tar.

title = "Ward (extra: chave privada e AWS, sem allowlist de caminho)"

[[rules]]
id = "ward-private-key"
description = "Chave privada (PEM/OpenSSH/PGP)"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S-]{64,}?KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

[[rules]]
id = "ward-aws-access-key-id"
description = "Access Key ID da AWS"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
keywords = ["a3t", "akia", "asia", "abia", "acca"]

[[rules]]
id = "ward-aws-secret-access-key"
description = "Secret Access Key da AWS (nome de variável ou chave de config + 40 caracteres)"
regex = '''(?i)(?:aws_?(?:secret_?access_?key|secret_?key|secret)|secret_?access_?key)\b["']?\s*(?:[:=]|:=|=>)\s*["']?([A-Za-z0-9/+=]{40})(?:["'\s,;]|$)'''
keywords = ["aws", "secret"]
