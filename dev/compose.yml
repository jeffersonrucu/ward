# Serviços de teste do Ward (Fase 12). Só credenciais FALSAS (D15).
#
#   make dev-servicos                          # gera .dev/servicos/ (rodar antes)
#   docker compose -f dev/compose.yml up -d --build
#   make dev-servicos-conferir                 # confere V1.4
#   docker compose -f dev/compose.yml down
#
# Segurança:
# - Toda porta publicada só em 127.0.0.1: nada de senha conhecida exposta na rede.
# - Segredos montados de .dev/servicos/ (0700) como arquivo somente leitura em
#   /run/ward/; nada de senha em `environment` (sairia no `docker inspect`) nem em argv.
#   Bind sem `create_host_path`: sem `make dev-servicos`, o `up` falha em vez de subir
#   com diretório vazio.
# - Estado em tmpfs: cada `up` depois de `down` começa limpo (posts.log vazio, banco e
#   WordPress reinstalados das fixtures). A única exceção é o volume `wp-html`, com o
#   código do WordPress (sem senha: o wp-config lê tudo de /run/ward/ na hora);
#   `down -v` o apaga.
# - `no-new-privileges` em todos; serviços Python com raiz somente leitura e usuário
#   nobody.
# - Imagens fixadas por digest.

name: ward-teste

x-seguranca: &seguranca
  security_opt:
    - no-new-privileges:true
  restart: "no"

x-ssh: &ssh
  <<: *seguranca
  build:
    context: ./servicos/ssh
  image: ward-teste/ssh:1
  pull_policy: build

x-web: &web
  <<: *seguranca
  image: python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
  user: "65534:65534"
  read_only: true
  environment:
    WARD_PORTA: "8080"
    PYTHONDONTWRITEBYTECODE: "1"
  tmpfs:
    - /tmp:size=8m,mode=0700,uid=65534,gid=65534

services:
  postgres:
    <<: *seguranca
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app_teste
      POSTGRES_PASSWORD_FILE: /run/ward/pg-app
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    volumes:
      - type: bind
        source: ../.dev/servicos/segredos/pg-app
        target: /run/ward/pg-app
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /var/lib/postgresql/data:size=256m,mode=0700,uid=70,gid=70
      - /var/run/postgresql:size=1m,mode=0775,uid=70,gid=70
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app_teste"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 2222: deploy por senha (túnel só até postgres:5432); sftpuser só sftp.
  ssh-senha:
    <<: *ssh
    environment:
      WARD_MODO: senha
    volumes:
      - { type: bind, source: ../.dev/servicos/ssh-host/ssh-senha/ssh_host_ed25519_key, target: /run/ward/ssh_host_ed25519_key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/segredos/ssh-deploy, target: /run/ward/senha-deploy, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/segredos/ssh-sftpuser, target: /run/ward/senha-sftpuser, read_only: true, bind: { create_host_path: false } }
    ports:
      - "127.0.0.1:2222:22"

  # 2223: deploy só por chave.
  ssh-chave:
    <<: *ssh
    environment:
      WARD_MODO: chave
    volumes:
      - { type: bind, source: ../.dev/servicos/ssh-host/ssh-chave/ssh_host_ed25519_key, target: /run/ward/ssh_host_ed25519_key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/chaves/acme-deploy_ed25519.pub, target: /run/ward/autorizada.pub, read_only: true, bind: { create_host_path: false } }
    ports:
      - "127.0.0.1:2223:22"

  # 2224: salto por senha; encaminha só para ssh-interno:22.
  ssh-salto:
    <<: *ssh
    environment:
      WARD_MODO: salto
    volumes:
      - { type: bind, source: ../.dev/servicos/ssh-host/ssh-salto/ssh_host_ed25519_key, target: /run/ward/ssh_host_ed25519_key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/segredos/ssh-salto, target: /run/ward/senha-salto, read_only: true, bind: { create_host_path: false } }
    ports:
      - "127.0.0.1:2224:22"
    networks:
      - default
      - interno

  # Sem porta no host; só a rede `interno` (internal) chega, isto é, o ssh-salto.
  ssh-interno:
    <<: *ssh
    hostname: ssh-interno
    environment:
      WARD_MODO: interno
    volumes:
      - { type: bind, source: ../.dev/servicos/ssh-host/ssh-interno/ssh_host_ed25519_key, target: /run/ward/ssh_host_ed25519_key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/chaves/acme-deploy_ed25519.pub, target: /run/ward/autorizada.pub, read_only: true, bind: { create_host_path: false } }
    networks:
      - interno

  mariadb:
    <<: *seguranca
    image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/ward/mariadb-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD_FILE: /run/ward/mariadb-wp
    volumes:
      - { type: bind, source: ../.dev/servicos/segredos/mariadb-root, target: /run/ward/mariadb-root, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/segredos/mariadb-wp, target: /run/ward/mariadb-wp, read_only: true, bind: { create_host_path: false } }
    tmpfs:
      - /var/lib/mysql:size=512m,mode=0700,uid=999,gid=999
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 60

  wordpress:
    <<: *seguranca
    image: wordpress:6.8-php8.3-apache@sha256:30bff39330d1693b0ce13d32fc9b7bb67193064f040b7d60d3494e136fa599d4
    depends_on:
      mariadb: { condition: service_healthy }
    environment: &wp-ambiente
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD_FILE: /run/ward/mariadb-wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8081');
        define('WP_SITEURL', 'http://localhost:8081');
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - { type: bind, source: ../.dev/servicos/segredos/mariadb-wp, target: /run/ward/mariadb-wp, read_only: true, bind: { create_host_path: false } }
      - wp-html:/var/www/html
    ports:
      - "127.0.0.1:8081:80"

  # Serviço de uma vez: instala o WordPress e cria wp_admin e wp_editor; sai com 0.
  wpcli:
    <<: *seguranca
    image: wordpress:cli-2.12-php8.3@sha256:a4fff017eb08c03187e90fe52d4bff8d3a4d4a5103de05829a6e747c4ca3056e
    user: "33:33"
    depends_on:
      wordpress: { condition: service_started }
    environment:
      <<: *wp-ambiente
      HOME: /tmp
    volumes:
      - wp-html:/var/www/html
      - { type: bind, source: ../.dev/servicos/segredos/mariadb-wp, target: /run/ward/mariadb-wp, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/segredos/wp-admin, target: /run/ward/wp-admin, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/segredos/wp-editor, target: /run/ward/wp-editor, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./servicos/wordpress/instalar.sh, target: /usr/local/bin/ward-instalar-wp, read_only: true, bind: { create_host_path: false } }
    entrypoint: ["/bin/sh", "/usr/local/bin/ward-instalar-wp"]

  # 8082: phishing. Grava todo POST em /registro/posts.log (tmpfs; ler com
  # `docker compose -f dev/compose.yml exec phish cat /registro/posts.log`).
  phish:
    <<: *web
    command: ["python3", "-I", "-B", "/app/servidor.py", "phish"]
    volumes:
      - { type: bind, source: ./servicos/web/servidor.py, target: /app/servidor.py, read_only: true, bind: { create_host_path: false } }
    tmpfs:
      - /tmp:size=8m,mode=0700,uid=65534,gid=65534
      - /registro:size=8m,mode=0700,uid=65534,gid=65534
    ports:
      - "127.0.0.1:8082:8080"

  # 8083: login com usuário, senha e código TOTP; cadastro novo em /cadastro.
  totp:
    <<: *web
    command: ["python3", "-I", "-B", "/app/servidor.py", "totp"]
    volumes:
      - { type: bind, source: ./servicos/web/servidor.py, target: /app/servidor.py, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ../.dev/servicos/segredos/totp-contas.json, target: /run/ward/totp-contas.json, read_only: true, bind: { create_host_path: false } }
    ports:
      - "127.0.0.1:8083:8080"

  # 8084: redireciona tudo para o phishing em 8082.
  redir:
    <<: *web
    command: ["python3", "-I", "-B", "/app/servidor.py", "redir"]
    volumes:
      - { type: bind, source: ./servicos/web/servidor.py, target: /app/servidor.py, read_only: true, bind: { create_host_path: false } }
    ports:
      - "127.0.0.1:8084:8080"

volumes:
  wp-html: {}

networks:
  default: {}
  # Rede só entre ssh-salto e ssh-interno. `internal` corta a saída e o
  # `inhibit_ipv4` tira o IP da ponte no host: o host não tem rota até o ssh-interno.
  interno:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
