# Extra scan of the working tree: the rules of `dev/gitleaks-extra.toml` minus the dirs
# that `.gitignore` keeps out of git (the same as in `dev/gitleaks-tree.toml`).
# The index and the history use `dev/gitleaks-extra.toml` directly, with no exception.

title = "Ward (extra, árvore de trabalho)"

[extend]
# Relative to the repository root (the Makefile runs from there).
path = "dev/gitleaks-extra.toml"

[[allowlists]]
description = "Diretórios ignorados pelo git"
paths = [
    '''^\.dev/''',
    '''^target/''',
    '''(^|/)node_modules/''',
    '''(^|/)dist/''',
    '''^\.claude/worktrees/''',   # the workers' worktrees: each one runs its own make check
    '''(^|/)dist-teste/''',
    '''^app/src-tauri/target/''',
    '''^app/src-tauri/gen/''',
    '''^app/src-tauri/permissions/autogenerated/''',
]
