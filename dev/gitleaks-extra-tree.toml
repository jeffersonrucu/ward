# Varredura extra da árvore de trabalho: as regras de `dev/gitleaks-extra.toml` menos
# os diretórios que o `.gitignore` tira do git (os mesmos de `dev/gitleaks-tree.toml`).
# O índice e o histórico usam `dev/gitleaks-extra.toml` direto, sem exceção nenhuma.

title = "Ward (extra, árvore de trabalho)"

[extend]
# Relativo à raiz do repositório (o Makefile roda de lá).
path = "dev/gitleaks-extra.toml"

[[allowlists]]
description = "Diretórios ignorados pelo git"
paths = [
    '''^\.dev/''',
    '''^target/''',
    '''(^|/)node_modules/''',
    '''(^|/)dist/''',
    '''^\.claude/worktrees/''',   # worktrees dos workers: cada um roda o próprio make check
    '''(^|/)dist-teste/''',
    '''^app/src-tauri/target/''',
    '''^app/src-tauri/gen/''',
    '''^app/src-tauri/permissions/autogenerated/''',
]
