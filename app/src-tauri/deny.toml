# cargo-deny of the Tauri app (S14). Same policy as the root `deny.toml`; the exceptions
# below exist only because of the Tauri/GTK 3 tree on Linux, with the reason for each one
# in the Phase 29 handoff. A new exception needs a reason written in the handoff.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
# The default `unsound` ("workspace") only looks at the workspace crates and the direct
# dependencies; with it cargo-deny did not see RUSTSEC-2024-0429 (glib, transitive) and
# warned `advisory-not-detected`, while `cargo audit` finds it. With "all" both see the
# same thing, and the exception below is no longer blind (D64, Phase 29b).
unsound = "all"
ignore = [
    # proc-macro-error 1.0.4: unmaintained. Only a build-time proc-macro of
    # glib-macros/gtk3-macros (gtk-rs 0.18, the base of Tauri 2 on Linux); does not run in
    # the app.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro de compilação do gtk-rs 0.18 (Tauri 2 no Linux); sem alternativa até o Tauri sair do GTK 3" },
    # glib 0.18.5: `VariantStrIter` with an unsound `Iterator`. The app does not use
    # `glib::Variant`; it comes from the gtk-rs 0.18 that Tauri 2 requires on Linux. Stays
    # (D64): `cargo audit` in app/src-tauri still detects it (Phase 29b, 2026-11-09).
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 do gtk-rs (Tauri 2 no Linux); o app não usa VariantStrIter" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# MPL-2.0 (per-file copyleft, files not modified): crates of the CSS and HTML parser that
# tauri-utils uses to inject the CSP into the page, and `option-ext` of `dirs`.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
