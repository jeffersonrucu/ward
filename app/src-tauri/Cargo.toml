[package]
name = "ward-app"
description = "App desktop do Ward (Tauri): cliente do daemon, sem tocar em segredo fora do copiar (D4)."
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Its own workspace (outside `make check`; see the `exclude` of the root Cargo.toml):
# Tauri needs the WebKitGTK development libraries and brings the GTK 3 tree.
# `make app-check` runs fmt, clippy, tests, audit and deny from here.
[workspace]

[[bin]]
name = "ward-app"
path = "src/main.rs"

[features]
# D7, V5.1: only the test app has devtools and talks to the test daemon (the test
# socket folder under `/run/user/<uid>/`). The release build does not turn this feature
# on and `make install` refuses artifacts built with it.
test-mode = ["tauri/devtools", "ward-app-core/test-mode"]

# Reason for each dependency in the Phase 29 handoff (S14).
[dependencies]
ward-app-core = { path = "../core" }
# Without the default features: leaves out `dynamic-acl` (capabilities only from the
# build, nothing added at run time), `x11`, `dbus` and `common-controls-v6`.
# `custom-protocol`: the interface always comes embedded in the binary
# (`tauri://localhost`), never from a development server (S11: no remote content).
# `tray-icon` (Phase 39, V5.23): tray icon and menu through AppIndicator. Brings
# `tray-icon`, `libappindicator(-sys)` and `libloading` (the system library is opened at
# run time; the app checks first that it exists, otherwise the crate panics).
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "custom-protocol", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
# "Add file" dialog on the Rust side (Phase 34, S11): the same gtk 0.18 that Tauri/wry
# already bring; no new crate in Cargo.lock.
gtk = { version = "=0.18.2", default-features = false }

[dev-dependencies]
# Fake Tauri runtime (`tauri::test`), for the ACL attack test (V5.1).
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "custom-protocol", "test"] }
serde_json = "1"

[build-dependencies]
# The command list of the app manifest comes from the core (a single source, S11).
ward-app-core = { path = "../core" }
tauri-build = { version = "=2.7.4", default-features = false, features = ["config-json"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
