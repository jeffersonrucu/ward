[package]
name = "ward-core"
description = "Núcleo do Ward: formato, criptografia, tipos, máscara e protocolo (sem dependência de Linux)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Crypto only through audited libraries (S6, V2.7). Reason for each one in the Phase 13 handoff.
[dependencies]
# `password-hash` (Phase 19b, D30): only the PHC text types (`phc`) and the constant-time
# comparison of `phc::Output`, for the PIN hash. The hash itself goes through
# `crypto::argon2id`. Brings no new crate to `Cargo.lock` (they were already there).
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize", "password-hash"] }
# `ctutils` (Phase 19c, D40): the `CtEq` that compares the recomputed output of the PIN
# hash with the stored one, in constant time. It is the same crate that `phc` already
# uses (it was in `Cargo.lock`); nothing new enters the tree.
ctutils = { version = "0.4.8", default-features = false }
# `base64ct` (Phase 20): constant-time base64 of the secrets in the socket protocol
# (RustCrypto). It was already in `Cargo.lock` (a dependency of `password-hash`/`phc`);
# nothing new enters the tree.
base64ct = { version = "1.8.3", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4.3", default-features = false }
# HMAC-SHA1 of TOTP (RFC 6238, Phase 18), from RustCrypto; `zeroize` clears the state on drop.
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# NFC of the typed master password (Phase 39c; handoff 30): the same text, composed or
# decomposed, has to open the vault through the app and through the CLI. There is no NFC
# in the standard library and building the table by hand would be worse. unicode-rs (the
# same project as `unicode-ident`), MIT/Apache-2.0; brings `tinyvec` and
# `tinyvec_macros` (Zlib/Apache-2.0/MIT), without platform `unsafe` or network.
unicode-normalization = { version = "=0.1.25", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true

# `make dev-vault` (Phase 19): builds the test vault in `.dev/` through the public API.
# Development only; `test = true` makes `cargo test` run its attack tests.
[[example]]
name = "dev-vault"
path = "examples/dev-vault/main.rs"
test = true
