[package]
name = "ward"
description = "CLI do Ward."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# D7/D46: test CLI. Talks to the test daemon (the user's 0700 test socket folder under
# `/run/user/<uid>/`, or `WARD_DEV_SOCKET_DIR`) and skips the uid 0 check;
# instead it requires the socket's process to be non-dumpable, like `wardd`.
# The installation refuses an artifact with this feature (V9.2).
test-mode = ["ward-platform/test-mode"]

# Reason for each dependency in the Phase 25 handoff (S14). None brings a new crate to
# `Cargo.lock`.
[dependencies]
# Socket protocol (request, response, frame).
ward-core = { workspace = true }
# Server check (D46) and password read from the terminal without echo.
ward-platform = { workspace = true }
# The master password stays in `Zeroizing` until it becomes the request's `Secret`.
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
