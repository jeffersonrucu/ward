[package]
name = "wardd"
description = "Daemon do Ward: único processo que toca em segredo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# D7: daemon de teste. Cofre e estado em `WARD_DEV_DIR` (obrigatório) e socket num
# diretório 0700 do usuário (`/run/user/<uid>/ward-teste/` ou `WARD_DEV_SOCKET_DIR`).
# Só muda caminhos: nenhuma operação, papel ou aprovador a mais (D8, V3.15). A
# instalação recusa artefato com esta feature (V9.2).
modo-teste = ["ward-plataforma/modo-teste"]

# Motivo de cada dependência no handoff da Fase 22 (S14). Nenhuma traz crate nova ao
# `Cargo.lock`.
[dependencies]
ward-core = { workspace = true }
ward-plataforma = { workspace = true }
# `libc`: só as constantes `O_NOFOLLOW`/`O_CLOEXEC` para abrir o cofre e o estado sem
# seguir link simbólico (nenhuma chamada; o crate não tem `unsafe`).
libc = { version = "0.2.191", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# Fase 24 (motivo no handoff): cliente D-Bus do logind no barramento do sistema
# (`Lock`, `LockedHint`, `PrepareForSleep` e o inibidor `delay`). A linha 5.x está
# marcada sem manutenção (RUSTSEC-2026-0370/0371/0372: o `zvariant` entrou no `zbus` 6).
# `default-rt`: o runtime interno do zbus (`zbus::block_on`), sem tokio, sem `proxy`,
# `service`, `p2p` nem `tracing`.
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt"] }
# Só o trait `Stream`, para ler o `MessageStream` do zbus (já vem com ele; nenhuma crate nova).
futures-core = { version = "0.3.34", default-features = false }

[dev-dependencies]
# V3.8: o teste do observador de memória desembrulha a chave de dados do cofre de teste
# com as mesmas bibliotecas auditadas do núcleo, para procurá-la nos blocos liberados.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Fase 24: o logind falso dos testes serve o `Inhibit` (`service`, só nos testes).
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt", "service"] }

# Cliente mínimo do contêiner de `make teste-docker-uid` (V3.2, D49): o `ubuntu:24.04`
# não tem Python.
[[example]]
name = "wardd-cliente-teste"
path = "examples/cliente-teste.rs"

[lints]
workspace = true
