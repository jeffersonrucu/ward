[package]
name = "wardd"
description = "Daemon do Ward: único processo que toca em segredo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# D7: test daemon. Vault and state in `WARD_DEV_DIR` (required) and the socket in a
# 0700 directory of the user (`/run/user/<uid>/<test dir>/` or `WARD_DEV_SOCKET_DIR`).
# It only changes paths: no extra operation, role or approver (D8, V3.15). The
# installation refuses an artifact with this feature (V9.2).
test-mode = ["ward-platform/test-mode"]
# M3 scrutiny: the hooks of the integration tests (`Daemon::with_hook_after_write`,
# V3.35, and `Daemon::with_ssh_programs`, Phase 27) only exist with this feature. It
# turns on `test-mode`, so an artifact with it is refused by the installation like the
# test one (V9.2) and `make test-no-test-mode` flags whoever turns it on through a normal
# dependency. No socket request reaches these hooks; V3.15 accepts the feature only there.
test-hooks = ["test-mode"]

# Reason for each dependency in the Phase 22 handoff (S14). None brings a new crate to
# `Cargo.lock`.
[dependencies]
ward-core = { workspace = true }
ward-platform = { workspace = true }
# `libc`: only the `O_NOFOLLOW`/`O_CLOEXEC` constants, to open the vault and the state
# without following a symbolic link (no call; the crate has no `unsafe`).
libc = { version = "0.2.191", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# Phase 24 (reason in the handoff): D-Bus client of logind on the system bus (`Lock`,
# `LockedHint`, `PrepareForSleep` and the `delay` inhibitor). The 5.x line is marked
# unmaintained (RUSTSEC-2026-0370/0371/0372: `zvariant` went into `zbus` 6).
# `default-rt`: the internal runtime of zbus (`zbus::block_on`), without tokio, `proxy`,
# `service`, `p2p` or `tracing`.
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt"] }
# Only the `Stream` trait, to read the zbus `MessageStream` (it already comes with it; no new crate).
futures-core = { version = "0.3.34", default-features = false }
# Phase 27 (reason in the handoff): temporary SSH agent of `ward ssh` with a key (D12).
# Reads the OpenSSH key of the entry (with a passphrase: bcrypt-pbkdf + AES, from
# RustCrypto) and signs with Ed25519 (`ed25519-dalek`) inside the daemon; the key never
# leaves it. No `rsa` (RUSTSEC-2023-0071), no default `getrandom`/`std`: only what is needed.
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["alloc", "ed25519", "encryption"] }
# Phase 44 (reason in the handoff): `ward playwright` talks to Chrome through the
# DevTools Protocol (JSON with floating point and negative numbers, which the strict
# protocol reader refuses). Only own structs with the fields in use (the rest is skipped
# without a copy) and the storage state in the Playwright format. Both are already in
# `Cargo.lock` (through `ward-app-core`); no new crate enters the tree.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[dev-dependencies]
# V3.8: the memory watcher test unwraps the data key of the test vault with the same
# audited libraries as the core, to look for it in the freed blocks.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Phase 24: the fake logind of the tests serves `Inhibit` (`service`, only in the tests).
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt", "service"] }

# Test app of the `wardd` tests (D63, Phase 23a): the binary that the open-app request of
# the test daemon opens through `WARD_DEV_APP`. Only with `test-mode`; outside `src/`
# (V3.15 reads the files of `src/`).
[[bin]]
name = "wardd-test-app"
path = "test-app/main.rs"
required-features = ["test-mode"]

# Test approval window of the M6 end-to-end suites (Phase 44c, D9): answers the requests
# with what the suite wrote in the mode file under `$WARD_DEV_DIR`. Only with
# `test-mode`, like the test app.
[[bin]]
name = "wardd-test-approver"
path = "test-approver/main.rs"
required-features = ["test-mode"]

# M4 scrutiny (Phase 28b): the integration tests that start the test `wardd`
# (`WARD_DEV_DIR`, `WARD_DEV_SOCKET_DIR`, `WARD_DEV_APP`) or use the hooks only exist
# with the feature. Without it (`cargo test -p wardd`), cargo skips them instead of
# building them and failing at run time against a release `wardd`.
[[test]]
name = "run"
required-features = ["test-mode"]

[[test]]
name = "socket"
required-features = ["test-mode"]

[[test]]
name = "lock"
required-features = ["test-mode"]

[[test]]
name = "test_app"
required-features = ["test-mode"]

[[test]]
name = "app_value_binary"
required-features = ["test-mode"]

[[test]]
name = "ssh"
required-features = ["test-hooks"]

[[test]]
name = "login"
required-features = ["test-hooks"]

[[test]]
name = "playwright"
required-features = ["test-hooks"]

# Minimal client of the container of `make test-docker-uid` (V3.2, D49): the
# `ubuntu:24.04` image has no Python.
[[example]]
name = "wardd-test-client"
path = "examples/test-client.rs"

[lints]
workspace = true
