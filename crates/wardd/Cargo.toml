[package]
name = "wardd"
description = "Daemon do Ward: único processo que toca em segredo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# D7: daemon de teste. Cofre e estado em `WARD_DEV_DIR` (obrigatório) e socket num
# diretório 0700 do usuário (`/run/user/<uid>/ward-teste/` ou `WARD_DEV_SOCKET_DIR`).
# Só muda caminhos: nenhuma operação, papel ou aprovador a mais (D8, V3.15). A
# instalação recusa artefato com esta feature (V9.2).
test-mode = ["ward-platform/test-mode"]
# Scrutiny do M3: os ganchos dos testes de integração (`Daemon::com_gancho_depois_de_gravar`,
# V3.35, e `Daemon::com_programas_ssh`, Fase 27) só existem com esta feature. Liga o
# `test-mode`, então o artefato com ela é recusado pela instalação como o de teste
# (V9.2) e o `make test-no-test-mode` acusa quem a ligar por dependência normal.
# Nenhum pedido do socket chega a esses ganchos; o V3.15 aceita a feature só neles.
test-hooks = ["test-mode"]

# Motivo de cada dependência no handoff da Fase 22 (S14). Nenhuma traz crate nova ao
# `Cargo.lock`.
[dependencies]
ward-core = { workspace = true }
ward-platform = { workspace = true }
# `libc`: só as constantes `O_NOFOLLOW`/`O_CLOEXEC` para abrir o cofre e o estado sem
# seguir link simbólico (nenhuma chamada; o crate não tem `unsafe`).
libc = { version = "0.2.191", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# Fase 24 (motivo no handoff): cliente D-Bus do logind no barramento do sistema
# (`Lock`, `LockedHint`, `PrepareForSleep` e o inibidor `delay`). A linha 5.x está
# marcada sem manutenção (RUSTSEC-2026-0370/0371/0372: o `zvariant` entrou no `zbus` 6).
# `default-rt`: o runtime interno do zbus (`zbus::block_on`), sem tokio, sem `proxy`,
# `service`, `p2p` nem `tracing`.
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt"] }
# Só o trait `Stream`, para ler o `MessageStream` do zbus (já vem com ele; nenhuma crate nova).
futures-core = { version = "0.3.34", default-features = false }
# Fase 27 (motivo no handoff): agente SSH temporário do `ward ssh` com chave (D12). Lê
# a chave OpenSSH da entrada (com passphrase: bcrypt-pbkdf + AES, pelo RustCrypto) e
# assina com Ed25519 (`ed25519-dalek`) dentro do daemon; a chave nunca sai dele. Sem
# `rsa` (RUSTSEC-2023-0071), sem `getrandom`/`std` padrão: só o necessário.
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["alloc", "ed25519", "encryption"] }
# Fase 44 (motivo no handoff): o `ward playwright` conversa com o Chrome pelo DevTools
# Protocol (JSON com números de ponto flutuante e negativos, que o leitor estrito do
# protocolo recusa). Só structs próprias com os campos usados (o resto é pulado sem cópia)
# e o storage state no formato do Playwright. Os dois já estão no `Cargo.lock` (pelo
# `ward-app-core`); nenhuma crate nova entra na árvore.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[dev-dependencies]
# V3.8: o teste do observador de memória desembrulha a chave de dados do cofre de teste
# com as mesmas bibliotecas auditadas do núcleo, para procurá-la nos blocos liberados.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Fase 24: o logind falso dos testes serve o `Inhibit` (`service`, só nos testes).
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt", "service"] }

# App de teste dos testes do `wardd` (D63, Fase 23a): o binário que o `abrir_app` do
# daemon de teste abre pelo `WARD_DEV_APP`. Só com `test-mode`; fora de `src/` (o
# V3.15 lê os arquivos de `src/`).
[[bin]]
name = "wardd-app-teste"
path = "app-teste/main.rs"
required-features = ["test-mode"]

# Janela de aprovação de teste das suítes de ponta a ponta do M6 (Fase 44c, D9): responde
# os pedidos com o que a suíte escreveu em `$WARD_DEV_DIR/aprovador.modo`. Só com
# `test-mode`, como o app de teste.
[[bin]]
name = "wardd-aprovador-teste"
path = "aprovador-teste/main.rs"
required-features = ["test-mode"]

# Scrutiny do M4 (Fase 28b): os testes de integração que sobem o `wardd` de teste
# (`WARD_DEV_DIR`, `WARD_DEV_SOCKET_DIR`, `WARD_DEV_APP`) ou usam os ganchos só existem
# com a feature. Sem ela (`cargo test -p wardd`), o cargo os pula em vez de compilá-los
# e falhar em tempo de execução contra um `wardd` de release.
[[test]]
name = "run"
required-features = ["test-mode"]

[[test]]
name = "socket"
required-features = ["test-mode"]

[[test]]
name = "trava"
required-features = ["test-mode"]

[[test]]
name = "app_teste"
required-features = ["test-mode"]

[[test]]
name = "app_valor"
required-features = ["test-mode"]

[[test]]
name = "ssh"
required-features = ["test-hooks"]

[[test]]
name = "login"
required-features = ["test-hooks"]

[[test]]
name = "playwright"
required-features = ["test-hooks"]

# Cliente mínimo do contêiner de `make test-docker-uid` (V3.2, D49): o `ubuntu:24.04`
# não tem Python.
[[example]]
name = "wardd-cliente-teste"
path = "examples/cliente-teste.rs"

[lints]
workspace = true
