[package]
name = "ward-plataforma"
description = "Módulos de plataforma do Ward (Linux): socket, peer credentials, endurecimento do processo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# D7/D46: forma de teste do servidor (pasta 0700 do usuário, par do mesmo uid), os
# construtores de teste e o ativador de socket dos testes. Sem a feature, o binário só
# aceita o socket do systemd do sistema.
modo-teste = []

# Motivo de cada uma no handoff da Fase 21. Nenhuma traz crate nova ao `Cargo.lock`
# (as duas já estavam lá, pelo `ward-core`).
[dependencies]
# `libc`: `getsockopt` (`SO_PEERCRED`, `SO_PEERPIDFD`), `pidfd_open`/
# `pidfd_send_signal`, `openat`/`readlinkat`, `prctl`, `setrlimit`, `mmap`/`mlock`/
# `madvise`. A biblioteca padrão não tem nenhuma delas estável.
libc = { version = "0.2.191", default-features = false }
# `zeroize`: zera o `BufferTravado` antes de devolver as páginas (S8).
zeroize = { version = "1.9.1", default-features = false }

# Binário de teste do contêiner (`make teste-docker-plataforma`). Só com `modo-teste`.
[[example]]
name = "ward-plataforma-conteiner"
path = "examples/conteiner.rs"
required-features = ["modo-teste"]

[lints]
workspace = true
