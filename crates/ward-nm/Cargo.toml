[package]
name = "ward-nm"
description = "Host de native messaging do Ward para a extensão do Chrome."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# D7/D46: test host. Talks to the test daemon (the user's 0700 test socket folder under
# `/run/user/<uid>/`, or `WARD_DEV_SOCKET_DIR`) and, instead of the uid 0
# check, requires the socket's process to be non-dumpable, like the test CLI. The
# installation refuses an artifact with this feature (V9.2).
test-mode = ["ward-platform/test-mode"]

# Reason for each dependency in the Phase 40 handoff (S14). None brings a new crate to
# `Cargo.lock`.
[dependencies]
# Socket protocol (request, response, frame): the same strict parsing as the daemon.
ward-core = { workspace = true }
# Server check (D46) and process hardening (dumpable 0, no core).
ward-platform = { workspace = true }
# Messages and frames with credentials in `Zeroizing` (S8).
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
