[workspace]
resolver = "3"
members = [
    "crates/ward-core",
    "crates/ward-platform",
    "crates/wardd",
    "crates/ward",
    "crates/ward-nm",
    "crates/ward-test-bridge",
    "app/core",
]
# The Tauri crate has its own workspace and lockfile (`app/src-tauri/Cargo.lock`): it
# needs the WebKitGTK development libraries to build and brings the GTK 3 tree. It stays
# out of `make check` and goes into `make app-check` (Phase 29).
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
publish = false

# New dependencies only with the reason written in the phase handoff (S14).
[workspace.dependencies]
ward-core = { path = "crates/ward-core" }
ward-platform = { path = "crates/ward-platform" }
ward-app-core = { path = "app/core" }

[workspace.lints.rust]
# `unsafe` only in `ward-platform`, with `// SAFETY:` and a test; the other crates use
# `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
strip = "symbols"

# Argon2id with 256 MiB takes tens of seconds without optimization, and the format tests
# use the real parameters (V2.2, V2.4). The crypto crates build optimized in the dev/test
# profile too; Ward's own code stays unoptimized.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
