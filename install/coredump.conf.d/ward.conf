# Ward (Phase 51c; S2, S8): systemd-coredump neither keeps nor processes any core.
#
# The WebKitGTK helpers the Ward app opens are dumpable, and Ubuntu's systemd-coredump
# ignores RLIMIT_CORE (core_pattern passes a fixed limit). It has no per-program list:
# the only way not to write the app's memory to /var/lib/systemd/coredump is to turn off
# the storage for the whole system. The crash is still logged in the journal (program
# and signal, without the memory). Goes away with `make uninstall` / `dpkg -r ward`. See
# docs/instalacao.md, "Core dump".
[Coredump]
Storage=none
ProcessSizeMax=0
