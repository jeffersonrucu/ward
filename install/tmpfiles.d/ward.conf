# Ward (D46, Phase 51): root's dir for the wardd sockets. wardd@<uid>.socket creates
# /run/ward/<uid>/ (root:root 0755) and the uid's socket (0600) inside it; the CLI and
# the app verify that every dir of the path is root's and not writable by group and
# others (S5).
d /run/ward 0755 root root -
