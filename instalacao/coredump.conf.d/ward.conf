# Ward (Fase 51c; S2, S8): o systemd-coredump não guarda nem processa core nenhum.
#
# Os auxiliares do WebKitGTK que o app do Ward abre são dumpable, e o systemd-coredump
# do Ubuntu ignora o RLIMIT_CORE (o core_pattern passa um limite fixo). Ele não tem
# lista por programa: a única forma de não gravar a memória do app em
# /var/lib/systemd/coredump é desligar o armazenamento para o sistema inteiro. O crash
# continua registrado no journal (programa e sinal, sem a memória). Sai com o
# `make uninstall` / `dpkg -r ward`. Veja docs/instalacao.md, "Core dump".
[Coredump]
Storage=none
ProcessSizeMax=0
