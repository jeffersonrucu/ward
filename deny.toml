# cargo-deny (S14): advisories, licenças, crates banidos e origem das dependências.
# Qualquer exceção aqui precisa de motivo escrito no handoff da fase que a criou.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
# O padrão do cargo-deny 0.20 ("workspace") não olha as dependências transitivas; com
# "all", um advisory "unsound" em qualquer crate do grafo reprova (handoff 29b, Fase 39c).
unsound = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# A lista é a política do projeto; não precisa já estar em uso.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
# Os crates do workspace são `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
