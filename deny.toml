# cargo-deny (S14): advisories, licenses, banned crates and origin of the dependencies.
# Any exception here needs a reason written in the handoff of the phase that created it.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
# The cargo-deny 0.20 default ("workspace") does not look at transitive dependencies;
# with "all", an "unsound" advisory in any crate of the graph fails (handoff 29b,
# Phase 39c).
unsound = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The list is the project policy; it does not need to be in use already.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
# The workspace crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
