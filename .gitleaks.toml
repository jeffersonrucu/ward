# gitleaks (S15): the repository never holds a real secret.
# Default gitleaks rules + an allowlist ONLY of the fixed fake values of the test vault
# (D15, the test vault table of the contract). Each value is matched whole (^...$): a
# fake value followed by a real secret is still found.
# Do not add a generic pattern (e.g. the fake prefix followed by `.*`) nor a whole path.

title = "Ward"

[extend]
useDefault = true

[[allowlists]]
description = "Valores falsos fixos do cofre de teste (D15)"
regexTarget = "secret"
condition = "OR"
regexes = [
    '''^falso-mestra-ward-01$''',
    '''^135790$''',
    '''^falso-WP-senha-01$''',
    '''^falso-WP-senha-02$''',
    '''^JBSWY3DPEHPK3PXP$''',
    '''^falso-PG:s3nha/01@#$''',
    '''^falso-PG%3As3nha%2F01%40%23$''',
    '''^falso-SSH-senha-01$''',
    '''^falso-passphrase-01$''',
    '''^falso-SALTO-01$''',
    '''^falso_token_github_01$''',
    '''^FALSOACCESSKEY01$''',
    '''^falso-aws-secret-01$''',
    '''^falso-aws-session-01$''',
    '''^falso-SMTP-01$''',
    '''^falso-SFTP-01$''',
    '''^falso-nota-01$''',
    '''^falso-licenca-01$''',
    '''^falso-anexo-01$''',
    '''^falso-BLOQ-01$''',
    '''^falso-REDIR-01$''',
    '''^falso-Ab3\$k&<9>Zq!'/ç-01$''',
    '''^falso-Ab3\$k&<9>Zq!'$''',
    # The protocol carries every secret in base64; the v2 fixture
    # (`dev/fixtures/protocol-v2.jsonl`, m2:DT8) has two D15 values under the key
    # `password`: the test master password and the WordPress one, each matched whole.
    '''^ZmFsc28tbWVzdHJhLXdhcmQtMDE=$''',
    '''^ZmFsc28tV1Atc2VuaGEtMDE=$''',
]
